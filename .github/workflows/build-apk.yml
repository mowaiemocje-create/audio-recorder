name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor Sync & Inject Foreground Service into Plugin
        run: |
          npx cap add android || true
          npx cap sync android

          cat << 'PYEOF' > patch_plugin.py
          import os

          # 1. Poprawienie AndroidManifest.xml aplikacji głównej
          app_manifest = "android/app/src/main/AndroidManifest.xml"
          with open(app_manifest, "r") as f:
              content = f.read()

          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          """
          if "</manifest>" in content and "FOREGROUND_SERVICE_MICROPHONE" not in content:
              content = content.replace("</manifest>", f"{perms}\n</manifest>")

          with open(app_manifest, "w") as f:
              f.write(content)

          # 2. Patchowanie wtyczki capacitor-voice-recorder, aby używała powiadomienia w pierwszym planie
          plugin_file = "node_modules/capacitor-voice-recorder/android/src/main/java/com/tchayen/voicerecorder/VoiceRecorder.java"
          if os.path.exists(plugin_file):
              with open(plugin_file, "r") as f:
                  code = f.read()

              # Modyfikacja kodu Javy wtyczki pod Foreground Service i WakeLock
              if "PARTIAL_WAKE_LOCK" not in code:
                  code = code.replace(
                      "import android.media.MediaRecorder;",
                      "import android.media.MediaRecorder;\nimport android.os.PowerManager;\nimport android.content.Context;"
                  )
                  code = code.replace(
                      "private MediaRecorder mediaRecorder;",
                      "private MediaRecorder mediaRecorder;\nprivate PowerManager.WakeLock wakeLock;"
                  )
                  start_patch = """
                  PowerManager pm = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                  if (pm != null && (wakeLock == null || !wakeLock.isHeld())) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "VoiceRecorder::Lock");
                      wakeLock.acquire();
                  }
                  """
                  code = code.replace("mediaRecorder.start();", f"mediaRecorder.start();\n{start_patch}")
                  
                  stop_patch = """
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                      wakeLock = null;
                  }
                  """
                  code = code.replace("mediaRecorder.stop();", f"mediaRecorder.stop();\n{stop_patch}")

                  with open(plugin_file, "w") as f:
                      f.write(code)
          PYEOF

          python3 patch_plugin.py

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
