name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/geolocation --save --legacy-peer-deps

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Install ImageMagick & Generate app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install @capacitor/assets --save-dev --legacy-peer-deps
          mkdir -p assets
          if [ -f "assets/icon-source.png" ]; then
            convert assets/icon-source.png -resize 1024x1024 -gravity center -background black -extent 1024x1024 assets/icon.png
            npx capacitor-assets generate --android || true
          fi

      - name: DIAGNOSTIC - lower targetSdkVersion to test
        run: |
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 33/' android/variables.gradle
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 33/' android/variables.gradle || true
          cat android/variables.gradle

      - name: Copy custom native recording service
        run: |
          mkdir -p android/app/src/main/java/com/pitchrec/backgroundrecorder
          cp native/BackgroundRecorderPlugin.java android/app/src/main/java/com/pitchrec/backgroundrecorder/
          cp native/BackgroundRecorderService.java android/app/src/main/java/com/pitchrec/backgroundrecorder/

      - name: Register plugin, add manifest permissions and service declaration
        run: |
          python3 -c '
          import re, glob

          candidates = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True) + \
                       glob.glob("android/app/src/main/java/**/MainActivity.kt", recursive=True)
          if not candidates:
              raise SystemExit("MainActivity nie znalezione — sprawdź strukturę projektu")
          main_activity_path = candidates[0]
          with open(main_activity_path, "r") as f:
              content = f.read()

          is_kotlin = main_activity_path.endswith(".kt")
          import_line = ("import com.pitchrec.backgroundrecorder.BackgroundRecorderPlugin" if is_kotlin
                         else "import com.pitchrec.backgroundrecorder.BackgroundRecorderPlugin;")
          register_call = ("registerPlugin(BackgroundRecorderPlugin::class.java)" if is_kotlin
                            else "registerPlugin(BackgroundRecorderPlugin.class);")

          if "BackgroundRecorderPlugin" not in content:
              lines = content.split("\n")
              import_indices = [i for i, l in enumerate(lines) if l.strip().startswith("import ")]
              if import_indices:
                  lines.insert(max(import_indices) + 1, import_line)
              else:
                  pkg_idx = next(i for i, l in enumerate(lines) if l.strip().startswith("package "))
                  lines.insert(pkg_idx + 1, "")
                  lines.insert(pkg_idx + 2, import_line)
              content = "\n".join(lines)

              onCreatePattern = (r"override fun onCreate\([^)]*\)\s*\{" if is_kotlin
                                 else r"protected void onCreate\([^)]*\)\s*\{")
              if re.search(onCreatePattern, content):
                  content = re.sub(onCreatePattern, lambda m: m.group(0) + "\n        " + register_call, content, count=1)
              else:
                  class_pattern = (r"(class MainActivity\s*:\s*BridgeActivity\(\)\s*\{)" if is_kotlin
                                    else r"(public class MainActivity extends BridgeActivity\s*\{)")
                  if is_kotlin:
                      new_method = (
                          "\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n"
                          "        " + register_call + "\n"
                          "        super.onCreate(savedInstanceState)\n"
                          "    }\n"
                      )
                  else:
                      new_method = (
                          "\n    @Override\n"
                          "    protected void onCreate(android.os.Bundle savedInstanceState) {\n"
                          "        " + register_call + "\n"
                          "        super.onCreate(savedInstanceState);\n"
                          "    }\n"
                      )
                  if re.search(class_pattern, content):
                      content = re.sub(class_pattern, r"\1" + new_method, content, count=1)
                  else:
                      raise SystemExit("Nie znaleziono deklaracji klasy MainActivity - sprawdz recznie")

      with open(main_activity_path, "w") as f:
          f.write(content)

      manifest_path = "android/app/src/main/AndroidManifest.xml"
      with open(manifest_path, "r") as f:
          content = f.read()

      perms = """
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.WAKE_LOCK" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
      """
      if "</manifest>" in content and "FOREGROUND_SERVICE_MICROPHONE" not in content:
          content = content.replace("</manifest>", f"{perms}\n</manifest>")

      service_decl = """
          <service android:name="com.pitchrec.backgroundrecorder.BackgroundRecorderService" android:foregroundServiceType="microphone" android:exported="false" />
      """
      if "</application>" in content and "BackgroundRecorderService" not in content:
          content = content.replace("</application>", f"{service_decl}\n</application>")

      with open(manifest_path, "w") as f:
          f.write(content)

      print("MainActivity poprawione:", main_activity_path)
      print("Manifest poprawiony:", manifest_path)
      '

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
