name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor Sync & Inject Foreground Service Permissions
        run: |
          npx cap add android || true
          npx cap sync android

          cat << 'PYEOF' > patch_manifest.py
          app_manifest = "android/app/src/main/AndroidManifest.xml"
          with open(app_manifest, "r") as f:
              content = f.read()

          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          """
          
          if "FOREGROUND_SERVICE_MICROPHONE" not in content:
              content = content.replace("</manifest>", f"{perms}\n</manifest>")

          # Wymuszenie flagi foregroundServiceType="microphone" dla usługi nagrywania
          if 'android:name="com.getcapacitor.community.speechrecognition.SpeechRecognition"' in content:
              content = content.replace(
                  'android:name="com.getcapacitor.community.speechrecognition.SpeechRecognition"',
                  'android:name="com.getcapacitor.community.speechrecognition.SpeechRecognition" android:foregroundServiceType="microphone"'
              )

          with open(app_manifest, "w") as f:
              f.write(content)
          PYEOF

          python3 patch_manifest.py

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
