name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Capacitor Sync & Fix WebView & System Permissions
        run: |
          npx cap add android || true

          python3 -c '
          import os
          dir_path = "android/app/src/main/java/com/example/audiorecorder"
          os.makedirs(dir_path, exist_ok=True)

          # 1. MainActivity.java z odblokowaniem mikrofonu w WebView (WebChromeClient)
          activity_code = """package com.example.audiorecorder;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioRecorderPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Odblokowanie dostępu do mikrofonu dla silnika WebView
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              request.grant(request.getResources());
                          }
                      });
                  }

                  requestSystemPermissions();
              }

              private void requestSystemPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] perms;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          perms = new String[]{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                              Manifest.permission.POST_NOTIFICATIONS
                          };
                      } else {
                          perms = new String[]{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          };
                      }
                      ActivityCompat.requestPermissions(this, perms, 101);
                  }
              }
          }
          """
          with open(os.path.join(dir_path, "MainActivity.java"), "w") as f:
              f.write(activity_code)

          # 2. AudioRecorderPlugin.java
          plugin_code = """package com.example.audiorecorder;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativeAudio")
          public class AudioRecorderPlugin extends Plugin {

              @PluginMethod
              public void startRecord(PluginCall call) {
                  boolean micGranted = ContextCompat.checkSelfPermission(getContext(), Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;

                  if (!micGranted) {
                      if (getActivity() != null) {
                          ActivityCompat.requestPermissions(
                              getActivity(),
                              new String[]{ Manifest.permission.RECORD_AUDIO },
                              101
                          );
                      }
                      call.reject("Uprawnienie do mikrofonu wymagane. Kliknij Record ponownie.");
                      return;
                  }

                  try {
                      Intent intent = new Intent(getContext(), AudioService.class);
                      intent.setAction("START");
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(intent);
                      } else {
                          getContext().startService(intent);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Błąd uruchamiania usługi: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void stopRecord(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), AudioService.class);
                      intent.setAction("STOP");
                      getContext().startService(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Błąd zatrzymywania usługi: " + e.getMessage());
                  }
              }
          }
          """
          with open(os.path.join(dir_path, "AudioRecorderPlugin.java"), "w") as f:
              f.write(plugin_code)

          # 3. AudioService.java
          service_code = """package com.example.audiorecorder;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;
          import java.io.File;

          public class AudioService extends Service {
              private static final String CHANNEL_ID = "audio_bg_channel";
              private static final int NOTIFICATION_ID = 1001;
              private MediaRecorder recorder;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent != null ? intent.getAction() : null;
                  if ("START".equals(action)) {
                      startForegroundServiceWithNotification();
                      startNativeRecording();
                  } else if ("STOP".equals(action)) {
                      stopNativeRecording();
                      stopForeground(true);
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void startForegroundServiceWithNotification() {
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Nagrywanie w tle")
                          .setContentText("Dyktafon rejestruje dźwięk...")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(NOTIFICATION_ID, notification);
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Audio Service",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              private void startNativeRecording() {
                  try {
                      File file = new File(getExternalFilesDir(null), "recording.m4a");
                      recorder = new MediaRecorder();
                      recorder.setAudioSource(MediaRecorder.AudioSource.MIC);
                      recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                      recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                      recorder.setOutputFile(file.getAbsolutePath());
                      recorder.prepare();
                      recorder.start();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void stopNativeRecording() {
                  if (recorder != null) {
                      try {
                          recorder.stop();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      recorder.release();
                      recorder = null;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          """
          with open(os.path.join(dir_path, "AudioService.java"), "w") as f:
              f.write(service_code)

          # 4. AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          """
          serv = """
              <service android:name=".AudioService" android:foregroundServiceType="microphone" android:exported="false" />
          """

          if "</manifest>" in manifest and "RECORD_AUDIO" not in manifest:
              manifest = manifest.replace("</manifest>", f"{perms}\n</manifest>")
          if "</application>" in manifest and "AudioService" not in manifest:
              manifest = manifest.replace("</application>", f"{serv}\n</application>")

          with open(manifest_path, "w") as f:
              f.write(manifest)
          '

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
