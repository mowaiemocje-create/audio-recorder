name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Capacitor Sync & Inject Low-Level AudioRecord WAV Engine
        run: |
          npx cap add android || true

          cat << 'PYEOF' > inject_code.py
          import os

          dir_path = "android/app/src/main/java/com/example/audiorecorder"
          os.makedirs(dir_path, exist_ok=True)

          # 1. MainActivity.java
          activity_code = """package com.example.audiorecorder;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioRecorderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          """
          with open(os.path.join(dir_path, "MainActivity.java"), "w") as f:
              f.write(activity_code)

          # 2. AudioRecorderPlugin.java
          plugin_code = """package com.example.audiorecorder;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "NativeAudio",
              permissions = {
                  @Permission(
                      alias = "microphone",
                      strings = { Manifest.permission.RECORD_AUDIO }
                  )
              }
          )
          public class AudioRecorderPlugin extends Plugin {

              @PluginMethod
              public void startRecord(PluginCall call) {
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      startServiceInternal(call);
                  } else {
                      requestPermissionForAlias("microphone", call, "micCallback");
                  }
              }

              @PermissionCallback
              private void micCallback(PluginCall call) {
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      startServiceInternal(call);
                  } else {
                      call.reject("Brak uprawnienia do mikrofonu.");
                  }
              }

              private void startServiceInternal(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), AudioService.class);
                      intent.setAction("START");
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(intent);
                      } else {
                          getContext().startService(intent);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Błąd uruchamiania usługi: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void stopRecord(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), AudioService.class);
                      intent.setAction("STOP");
                      getContext().startService(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Błąd zatrzymywania usługi: " + e.getMessage());
                  }
              }
          }
          """
          with open(os.path.join(dir_path, "AudioRecorderPlugin.java"), "w") as f:
              f.write(plugin_code)

          # 3. AudioService.java z niskopoziomowym silnikiem AudioRecord (PCM -> WAV)
          service_code = """package com.example.audiorecorder;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.RandomAccessFile;

          public class AudioService extends Service {
              private static final String CHANNEL_ID = "audio_bg_channel";
              private static final int NOTIFICATION_ID = 1001;
              private static final int SAMPLE_RATE = 44100;

              private AudioRecord audioRecord;
              private Thread recordingThread;
              private boolean isRecording = false;
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent != null ? intent.getAction() : null;
                  if ("START".equals(action)) {
                      acquireWakeLock();
                      startForegroundServiceWithNotification();
                      startPcmRecording();
                  } else if ("STOP".equals(action)) {
                      stopPcmRecording();
                      releaseWakeLock();
                      stopForeground(true);
                      stopSelf();
                  }
                  return START_STICKY;
              }

              private void acquireWakeLock() {
                  if (wakeLock == null) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "AudioRecorder::ServiceWakeLock");
                          wakeLock.acquire();
                      }
                  }
              }

              private void releaseWakeLock() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                      wakeLock = null;
                  }
              }

              private void startForegroundServiceWithNotification() {
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Nagrywanie w tle")
                          .setContentText("Niskopoziomowe rejestrowanie dźwięku...")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setOngoing(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(NOTIFICATION_ID, notification);
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Audio Service",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              private synchronized void startPcmRecording() {
                  if (isRecording) return;

                  int bufferSize = AudioRecord.getMinBufferSize(
                          SAMPLE_RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT
                  );

                  if (bufferSize == AudioRecord.ERROR || bufferSize == AudioRecord.ERROR_BAD_VALUE) {
                      bufferSize = SAMPLE_RATE * 2;
                  }

                  int audioSource = MediaRecorder.AudioSource.VOICE_RECOGNITION;

                  try {
                      audioRecord = new AudioRecord(
                              audioSource,
                              SAMPLE_RATE,
                              AudioFormat.CHANNEL_IN_MONO,
                              AudioFormat.ENCODING_PCM_16BIT,
                              bufferSize * 2
                      );

                      if (audioRecord.getState() != AudioRecord.STATE_INITIALIZED) {
                          audioRecord = new AudioRecord(
                                  MediaRecorder.AudioSource.MIC,
                                  SAMPLE_RATE,
                                  AudioFormat.CHANNEL_IN_MONO,
                                  AudioFormat.ENCODING_PCM_16BIT,
                                  bufferSize * 2
                          );
                      }

                      audioRecord.startRecording();
                      isRecording = true;

                      final int finalBufferSize = bufferSize;
                      recordingThread = new Thread(() -> writeWavFile(finalBufferSize));
                      recordingThread.start();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void writeWavFile(int bufferSize) {
                  File file = new File(getExternalFilesDir(null), "recording.wav");
                  byte[] data = new byte[bufferSize];

                  try (FileOutputStream out = new FileOutputStream(file)) {
                      writeWavHeader(out, 1, SAMPLE_RATE, 16, 0);

                      long totalPcmBytes = 0;
                      while (isRecording && audioRecord != null) {
                          int read = audioRecord.read(data, 0, data.length);
                          if (read > 0) {
                              out.write(data, 0, read);
                              totalPcmBytes += read;
                          }
                      }

                      updateWavHeader(file, totalPcmBytes);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void writeWavHeader(FileOutputStream out, int channels, int sampleRate, int bitDepth, long pcmDataSize) throws Exception {
                  long totalDataLen = pcmDataSize + 36;
                  long byteRate = sampleRate * channels * (bitDepth / 8);

                  byte[] header = new byte[44];
                  header[0] = 'R'; header[1] = 'I'; header[2] = 'F'; header[3] = 'F';
                  header[4] = (byte) (totalDataLen & 0xff);
                  header[5] = (byte) ((totalDataLen >> 8) & 0xff);
                  header[6] = (byte) ((totalDataLen >> 16) & 0xff);
                  header[7] = (byte) ((totalDataLen >> 24) & 0xff);
                  header[8] = 'W'; header[9] = 'A'; header[10] = 'V'; header[11] = 'E';
                  header[12] = 'f'; header[13] = 'm'; header[14] = 't'; header[15] = ' ';
                  header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0;
                  header[20] = 1; header[21] = 0;
                  header[22] = (byte) channels; header[23] = 0;
                  header[24] = (byte) (sampleRate & 0xff);
                  header[25] = (byte) ((sampleRate >> 8) & 0xff);
                  header[26] = (byte) ((sampleRate >> 16) & 0xff);
                  header[27] = (byte) ((sampleRate >> 24) & 0xff);
                  header[28] = (byte) (byteRate & 0xff);
                  header[29] = (byte) ((byteRate >> 8) & 0xff);
                  header[30] = (byte) ((byteRate >> 16) & 0xff);
                  header[31] = (byte) ((byteRate >> 24) & 0xff);
                  header[32] = (byte) (channels * (bitDepth / 8)); header[33] = 0;
                  header[34] = (byte) bitDepth; header[35] = 0;
                  header[36] = 'd'; header[37] = 'a'; header[38] = 't'; header[39] = 'a';
                  header[40] = (byte) (pcmDataSize & 0xff);
                  header[41] = (byte) ((pcmDataSize >> 8) & 0xff);
                  header[42] = (byte) ((pcmDataSize >> 16) & 0xff);
                  header[43] = (byte) ((pcmDataSize >> 24) & 0xff);

                  out.write(header, 0, 44);
              }

              private void updateWavHeader(File file, long pcmDataSize) {
                  try (RandomAccessFile raf = new RandomAccessFile(file, "rw")) {
                      long totalDataLen = pcmDataSize + 36;
                      raf.seek(4);
                      raf.write((int) (totalDataLen & 0xff));
                      raf.write((int) ((totalDataLen >> 8) & 0xff));
                      raf.write((int) ((totalDataLen >> 16) & 0xff));
                      raf.write((int) ((totalDataLen >> 24) & 0xff));

                      raf.seek(40);
                      raf.write((int) (pcmDataSize & 0xff));
                      raf.write((int) ((pcmDataSize >> 8) & 0xff));
                      raf.write((int) ((pcmDataSize >> 16) & 0xff));
                      raf.write((int) ((pcmDataSize >> 24) & 0xff));
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private synchronized void stopPcmRecording() {
                  isRecording = false;
                  if (audioRecord != null) {
                      try {
                          if (audioRecord.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) {
                              audioRecord.stop();
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      audioRecord.release();
                      audioRecord = null;
                  }
                  if (recordingThread != null) {
                      try {
                          recordingThread.join(1000);
                      } catch (InterruptedException e) {
                          e.printStackTrace();
                      }
                      recordingThread = null;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  stopPcmRecording();
                  releaseWakeLock();
              }
          }
          """
          with open(os.path.join(dir_path, "AudioService.java"), "w") as f:
              f.write(service_code)

          # 4. AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          needed_permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.WAKE_LOCK"
          ]

          perm_tags = ""
          for p in needed_permissions:
              if f'name="{p}"' not in manifest:
                  perm_tags += f'    <uses-permission android:name="{p}" />\n'

          if perm_tags:
              manifest = manifest.replace("</manifest>", f"{perm_tags}</manifest>")

          if "AudioService" not in manifest:
              service_tag = '    <service android:name=".AudioService" android:foregroundServiceType="microphone" android:exported="false" />\n'
              manifest = manifest.replace("</application>", f"{service_tag}</application>")

          with open(manifest_path, "w") as f:
              f.write(manifest)
          PYEOF

          python3 inject_code.py
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
