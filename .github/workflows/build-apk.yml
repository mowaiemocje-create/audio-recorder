name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor Sync & Inject Permissions
        run: |
          npx cap add android || true

          cat << 'PYEOF' > inject_manifest.py
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          needed_permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.WAKE_LOCK"
          ]

          perm_tags = ""
          for p in needed_permissions:
              if f'name="{p}"' not in manifest:
                  perm_tags += f'    <uses-permission android:name="{p}" />\n'

          if perm_tags:
              manifest = manifest.replace("</manifest>", f"{perm_tags}</manifest>")

          with open(manifest_path, "w") as f:
              f.write(manifest)
          PYEOF

          python3 inject_manifest.py
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
