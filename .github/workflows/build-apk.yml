name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/geolocation --save --legacy-peer-deps

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      # Generuje WSZYSTKIE wymagane rozmiary ikony (dla każdej gęstości ekranu: mdpi, hdpi,
      # xhdpi, xxhdpi, xxxhdpi + wersje okrągłe) z JEDNEGO pliku źródłowego logo. Logo nie
      # musi być idealnym kwadratem — ImageMagick dopełnia je czarnym tłem (dopasowanym do
      # tła samego logo) do kwadratu przed przekazaniem do oficjalnego narzędzia Capacitora.
      - name: Generate app icon from logo
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install @capacitor/assets --save-dev --legacy-peer-deps
          mkdir -p assets
          convert assets/icon-source.png -resize 1024x1024 -gravity center -background black -extent 1024x1024 assets/icon.png
          npx capacitor-assets generate --android

      # UWAGA: test diagnostyczny (obniżenie targetSdkVersion do 33) POTWIERDZIŁ, że to
      # WŁAŚNIE restrykcje Androida 15/SDK 35 blokują nagrywanie w tle — ale Google Play
      # ostrzega/blokuje publikację aplikacji celujących w zbyt stare SDK, więc to nie jest
      # opcja na stałe. Zostajemy na domyślnym 35 (zgodnym z wymogami sklepu) — potrzebne jest
      # inne obejście, które nie wymaga obniżania targetSdkVersion.

      # WŁASNY, ZINTEGROWANY kod natywny — teraz w DWÓCH warstwach:
      # 1. Java (BackgroundRecorderService) — Foreground Service, MediaSession, WakeLock,
      #    AudioFocus, powiadomienie — cała "otoczka" ochronna.
      # 2. C++ (native-lib.cpp, przez AAudio) — SAMO nagrywanie (pętla odczytu próbek, zapis
      #    WAV) przeniesione POZA Javę, po tym jak wszystkie techniki na poziomie Java
      #    (nawet dokładnie odtwarzające potwierdzony, działający wzorzec z zdekompilowanej
      #    aplikacji) nie rozwiązały problemu ucinania nagrywania po 5s od zablokowania ekranu.
      - name: Copy custom native recording service (Java + C++)
        run: |
          mkdir -p android/app/src/main/java/com/pitchrec/backgroundrecorder
          cp native/BackgroundRecorderPlugin.java android/app/src/main/java/com/pitchrec/backgroundrecorder/
          cp native/BackgroundRecorderService.java android/app/src/main/java/com/pitchrec/backgroundrecorder/
          cp native/NativeAudioRecorder.java android/app/src/main/java/com/pitchrec/backgroundrecorder/
          mkdir -p android/app/src/main/cpp
          cp native/cpp/native-lib.cpp android/app/src/main/cpp/
          cp native/cpp/CMakeLists.txt android/app/src/main/cpp/

      - name: Configure Gradle for native C++ build (CMake)
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          default_config_addition = """        ndk {
              abiFilters \"arm64-v8a\", \"armeabi-v7a\"
          }
          externalNativeBuild {
              cmake {
                  cppFlags \"\"
              }
          }
          """
          marker = "testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\n"
          if marker in content and "externalNativeBuild" not in content:
              content = content.replace(marker, marker + default_config_addition)

          android_level_addition = """    externalNativeBuild {
              cmake {
                  path \"src/main/cpp/CMakeLists.txt\"
                  version \"3.22.1\"
              }
          }
          """
          marker2 = "    buildTypes {\n"
          if marker2 in content and "src/main/cpp/CMakeLists.txt" not in content:
              content = content.replace(marker2, android_level_addition + marker2)

          with open(path, "w") as f:
              f.write(content)
          print("build.gradle skonfigurowany dla CMake")
          '

      - name: Register plugin, add manifest permissions and service declaration
        run: |
          python3 -c '
          import re, glob

          # ── 1. Zarejestruj wtyczkę w MainActivity (Java albo Kotlin, z lub bez istniejącego onCreate) ──
          candidates = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True) + \
                       glob.glob("android/app/src/main/java/**/MainActivity.kt", recursive=True)
          if not candidates:
              raise SystemExit("MainActivity nie znalezione — sprawdź strukturę projektu")
          main_activity_path = candidates[0]
          with open(main_activity_path, "r") as f:
              content = f.read()

          is_kotlin = main_activity_path.endswith(".kt")
          import_line = ("import com.pitchrec.backgroundrecorder.BackgroundRecorderPlugin" if is_kotlin
                         else "import com.pitchrec.backgroundrecorder.BackgroundRecorderPlugin;")
          register_call = ("registerPlugin(BackgroundRecorderPlugin::class.java)" if is_kotlin
                            else "registerPlugin(BackgroundRecorderPlugin.class);")

          if "BackgroundRecorderPlugin" not in content:
              lines = content.split("\n")
              import_indices = [i for i, l in enumerate(lines) if l.strip().startswith("import ")]
              if import_indices:
                  lines.insert(max(import_indices) + 1, import_line)
              else:
                  pkg_idx = next(i for i, l in enumerate(lines) if l.strip().startswith("package "))
                  lines.insert(pkg_idx + 1, "")
                  lines.insert(pkg_idx + 2, import_line)
              content = "\n".join(lines)

              onCreatePattern = (r"override fun onCreate\([^)]*\)\s*\{" if is_kotlin
                                 else r"protected void onCreate\([^)]*\)\s*\{")
              if re.search(onCreatePattern, content):
                  # onCreate juz istnieje - wstaw wywolanie na samym poczatku, PRZED super.onCreate
                  content = re.sub(onCreatePattern, lambda m: m.group(0) + "\n        " + register_call, content, count=1)
              else:
                  # onCreate NIE istnieje (typowe w nowszych szablonach Capacitor z pusta klasa) -
                  # trzeba dodac cala metode, nie tylko wstawic linie do nieistniejacej.
                  class_pattern = (r"(class MainActivity\s*:\s*BridgeActivity\(\)\s*\{)" if is_kotlin
                                    else r"(public class MainActivity extends BridgeActivity\s*\{)")
                  if is_kotlin:
                      new_method = (
                          "\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n"
                          "        " + register_call + "\n"
                          "        super.onCreate(savedInstanceState)\n"
                          "    }\n"
                      )
                  else:
                      new_method = (
                          "\n    @Override\n"
                          "    protected void onCreate(android.os.Bundle savedInstanceState) {\n"
                          "        " + register_call + "\n"
                          "        super.onCreate(savedInstanceState);\n"
                          "    }\n"
                      )
                  if re.search(class_pattern, content):
                      content = re.sub(class_pattern, r"\1" + new_method, content, count=1)
                  else:
                      raise SystemExit("Nie znaleziono deklaracji klasy MainActivity - sprawdz recznie")

          with open(main_activity_path, "w") as f:
              f.write(content)

          # ── 2. Uprawnienia + deklaracja <service> w AndroidManifest.xml ──
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """
          if "</manifest>" in content and "FOREGROUND_SERVICE_MICROPHONE" not in content:
              content = content.replace("</manifest>", f"{perms}\n</manifest>")

          service_decl = """
              <service android:name="com.pitchrec.backgroundrecorder.BackgroundRecorderService" android:foregroundServiceType="microphone|mediaPlayback" android:exported="false" />
          """
          if "</application>" in content and "BackgroundRecorderService" not in content:
              content = content.replace("</application>", f"{service_decl}\n</application>")

          with open(manifest_path, "w") as f:
              f.write(content)

          print("MainActivity poprawione:", main_activity_path)
          print("Manifest poprawiony:", manifest_path)
          '

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
